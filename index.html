<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackbody Radiation and Planck's Quantum Hypothesis</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="reveal lesson-deck" id="lessonDeck">
    <div class="slides" id="slides"></div>
  </div>

  <canvas id="inkCanvas" aria-label="Presentation drawing layer"></canvas>

  <div class="deck-ui" aria-label="Presentation controls">
    <div class="action-bar" id="actionBar" aria-label="Slide actions"></div>

    <div class="draw-tools" aria-label="Drawing tools">
      <button class="icon-btn text" id="drawToggle" type="button" aria-pressed="false">
        <i data-lucide="pencil"></i><span>draw off</span>
      </button>
      <button class="icon-btn active" id="penMode" type="button" aria-label="Pen"><i data-lucide="pen-line"></i></button>
      <button class="icon-btn" id="eraserMode" type="button" aria-label="Eraser"><i data-lucide="eraser"></i></button>
      <button class="swatch cyan selected" data-color="#58c4dd" type="button" aria-label="Cyan pen"></button>
      <button class="swatch yellow" data-color="#f4d35e" type="button" aria-label="Yellow pen"></button>
      <button class="swatch red" data-color="#ff5a5f" type="button" aria-label="Red pen"></button>
      <button class="swatch white" data-color="#f5fbff" type="button" aria-label="White pen"></button>
      <input id="penSize" type="range" min="3" max="26" value="9" aria-label="Pen size">
      <button class="icon-btn" id="undoInk" type="button" aria-label="Undo ink"><i data-lucide="undo-2"></i></button>
      <button class="icon-btn" id="clearInk" type="button" aria-label="Clear ink"><i data-lucide="trash-2"></i></button>
    </div>

    <nav class="nav" aria-label="Slide navigation">
      <button class="round" id="prevSlide" type="button" aria-label="Previous slide"><i data-lucide="chevron-left"></i></button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="round" id="nextSlide" type="button" aria-label="Next slide"><i data-lucide="chevron-right"></i></button>
      <button class="round" id="fullScreen" type="button" aria-label="Fullscreen"><i data-lucide="maximize"></i></button>
    </nav>
  </div>

  <section class="video-modal" id="videoModal" aria-hidden="true">
    <div class="video-backdrop" id="videoBackdrop"></div>
    <div class="video-shell" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
      <div class="video-head">
        <div>
          <h2 id="videoTitle">Classroom clip</h2>
        </div>
        <button class="icon-btn text" id="closeVideo" type="button">
          <i data-lucide="x"></i><span>close</span>
        </button>
      </div>
      <iframe id="videoFrame" title="Classroom video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      <p id="videoNote"></p>
      <a id="videoLink" href="#" target="_blank" rel="noreferrer">open on YouTube</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="src/slides.js?v=20260506-remove-derive-prompt"></script>
  <script src="src/app.js?v=20260506-remove-derive-prompt"></script>
</body>
</html>
